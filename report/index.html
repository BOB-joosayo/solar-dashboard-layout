<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>태양광 분석 리포트 · HTML (A4)</title>
  <style>
    body {
      font-family: "Malgun Gothic", "Apple SD Gothic Neo", sans-serif;
      background: #f0f3f7;
      color: #2d3138;
      margin: 0;
      padding: 40px 24px;
    }
    .wrap { max-width: 720px; margin: 0 auto; }
    h1 { font-size: 22px; color: #1a2b4a; margin: 0 0 8px; }
    .sub { color: #78808c; font-size: 14px; margin-bottom: 28px; }
    .cards { display: grid; gap: 14px; }
    a.card {
      display: block;
      background: #fff;
      border: 1px solid #dadfe8;
      border-radius: 10px;
      padding: 18px 20px;
      text-decoration: none;
      color: inherit;
      transition: box-shadow .15s;
    }
    a.card:hover { box-shadow: 0 6px 20px rgba(26,43,74,.12); }
    a.card strong { display: block; font-size: 16px; color: #1a2b4a; margin-bottom: 4px; }
    a.card span { font-size: 13px; color: #78808c; }
    .tag {
      display: inline-block;
      font-size: 11px;
      background: #e8f5e9;
      color: #2e7d32;
      border-radius: 4px;
      padding: 2px 8px;
      margin-left: 8px;
      vertical-align: middle;
    }
    .foot { margin-top: 28px; font-size: 12px; color: #78808c; line-height: 1.6; }
  </style>
</head>
<body>
  <div class="wrap">
    <h1>태양광 분석 리포트 <span class="tag">HTML · A4</span></h1>
    <p class="sub">일 · 월 · 연 Mock · 샘플빌딩</p>
    <div class="cards">
      <a class="card" href="daily.html">
        <strong>일간 리포트</strong>
        <span>2026-09-15 · 3페이지 · 발전 · 산정 수익(SMP·REC) · 성능 · 인버터 · 채널 · 데이터</span>
      </a>
      <a class="card" href="monthly.html">
        <strong>월간 리포트</strong>
        <span>2026년 09월 · 3페이지 · 수익 · 상태 캘린더 · 인버터 월 요약 · 일자별 데이터</span>
      </a>
      <a class="card" href="yearly.html">
        <strong>연간 리포트</strong>
        <span>2026년 · 2페이지 · 연 수익 · 월별 성능·수익 · 상태 요약 · 인버터 연 요약</span>
      </a>
    </div>
  </div>
</body>
</html>
